name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  analyze-and-test:
    name: 静态分析 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装依赖
        run: flutter pub get
      - name: 静态分析
        run: flutter analyze
      - name: 单元与 Widget 测试
        run: flutter test --reporter expanded

  build-apk:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装依赖
        run: flutter pub get
      - name: 构建 APK
        run: flutter build apk --release
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: asset-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  release-apk:
    name: 发布 APK 到 Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asset-manager-release-apk
          path: dist
      - name: 计算版本号
        id: ver
        run: echo "tag=v$(date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"
      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Android Release ${{ steps.ver.outputs.tag }}
          body: |
            本版本包含：iOS 健身风格视觉重塑、多类别收支管理、每月固定收支规则、基金截图识别、基金定投管理。
            - Flutter 3.50.1 / 69 个自动化测试全绿
            - 日志见对应 commit
          files: dist/app-release.apk
          overwrite_files: true
