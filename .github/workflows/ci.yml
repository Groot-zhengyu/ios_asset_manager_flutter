name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  analyze-and-test:
    name: 静态分析 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装依赖
        run: flutter pub get
      - name: 静态分析
        run: flutter analyze
      - name: 单元与 Widget 测试
        run: flutter test --reporter expanded

  build-apk:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装依赖
        run: flutter pub get
      - name: 构建 APK
        run: flutter build apk --release
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: asset-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
