name: ios_asset_manager_flutter
description: 资产管家 - Flutter 双端（Android / iOS）离线资产管理应用。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^1.0.3
  http: ^1.6.0
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#204FA8"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
